    <nav class="navbar">

        <div class="nav-links">

        <p class="section-label">
            INTERVIEW PRACTICE

            Let's Prepare for Your Interview
        </h1>

        <p class="practice-description">
            Choose your target role and start practicing interview questions.
        </p>


        <div class="practice-card">

            <label for="role">

            </label>

            <select id="role">

                <option value="">
                    Select a role
                </option>

                <option value="software">
                    Software Developer
                </option>

                <option value="frontend">
                    Frontend Developer
                </option>

                <option value="backend">
                    Backend Developer
                </option>

                <option value="python">
                    Python Developer
                </option>

            </select>


            <button class="practice-button">
                Start Interview
            </button>

        </div>


        <a href="index.html" class="practice-home-link">
            ← Back to Home
        </a>
